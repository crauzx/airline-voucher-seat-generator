services:
  backend:
    build:
      context: ./backend
    container_name: voucher-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DB_PATH: /app/data/vouchers.db
      TRUST_PROXY: 1
    volumes:
      - vouchers-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: voucher-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vouchers-data:
